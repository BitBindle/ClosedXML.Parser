name: Release

# A person starts this workflow. It builds and tests the commit, publishes the NuGet package to nuget.org
# and creates a GitHub release with generated release notes.
#
# VersionMajorMinor in Directory.Build.props sets the major and minor version. The patch version is the highest
# patch of the existing tags of that major.minor plus one (.github/scripts/next-version.sh).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack, but do not create a tag, publish the package or create a release
        type: boolean
        default: false

# Two releases at the same time can get the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    # A release comes only from develop.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Create the tag and the release
      id-token: write   # Get a short-lived nuget.org API key with trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # next-version.sh reads all tags to find the next patch version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        run: |
          version="$(.github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Releasing $version"

      - name: Check that nuget.org does not have the version
        # nuget.org refuses a version that it already has. The check stops the workflow before it creates the tag.
        # The flat container returns 404 when the package ID does not exist yet. This is the case for the first release.
        run: |
          url="https://api.nuget.org/v3-flatcontainer/bitbindle.closedxml.parser/index.json"
          status="$(curl --silent --show-error --output versions.json --write-out '%{http_code}' "$url")"
          if [[ "$status" == 200 ]]; then
            if jq --exit-status --arg v "${version,,}" '.versions | index($v)' versions.json > /dev/null; then
              echo "::error::nuget.org already has BitBindle.ClosedXML.Parser $version. Change VersionMajorMinor or VersionSuffix in Directory.Build.props."
              exit 1
            fi
          elif [[ "$status" != 404 ]]; then
            echo "::error::nuget.org returned HTTP $status for $url"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore ClosedXML.Parser.slnx

      - name: Build
        # VersionPrefix is major.minor.patch. Directory.Build.props gives the suffix. The RepositoryUrl
        # parameter makes sure that the package links to the repository that runs the workflow.
        run: >
          dotnet build ClosedXML.Parser.slnx --configuration Release --no-restore
          -p:VersionPrefix="${version%%-*}"
          -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}"

      - name: Test
        run: >
          dotnet test src/ClosedXML.Parser.Tests/ClosedXML.Parser.Tests.csproj
          --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/ClosedXML.Parser/ClosedXML.Parser.csproj
          --configuration Release --no-build --output artifacts
          -p:VersionPrefix="${version%%-*}"
          -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}"

      - name: Check package
        run: |
          ls -l artifacts
          [[ -f "artifacts/BitBindle.ClosedXML.Parser.$version.nupkg" ]] || { echo "::error::Package BitBindle.ClosedXML.Parser.$version.nupkg is missing"; exit 1; }

      - name: Create tag
        # The tag reserves the version. If a later step fails, the next release does not use the version again.
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "$version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"

      - name: Log in to nuget.org
        # Trusted publishing. The action exchanges the OIDC token of the workflow for a short-lived API key.
        # The secret NUGET_USER holds the nuget.org user name (not the e-mail address) of the policy owner.
        if: ${{ !inputs.dry_run }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # The push of a .nupkg also pushes the .snupkg symbol package in the same folder.
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$version" artifacts/*.nupkg artifacts/*.snupkg \
            --verify-tag --title "$version" --generate-notes "${prerelease[@]}"
